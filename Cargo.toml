[package]
name = "controw"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["trace"] }
futures-util = "0.3.33"
enigo = "*"
vigem-client = {version = "0.1.4",features = ["unstable_xtarget_notification"]}
ratatui = "0.28"
crossterm = "0.28"
qrcode = "0.14"