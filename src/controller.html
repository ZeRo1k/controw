<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1b1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Controw</title>
<style>
:root {
    --u: min(1dvh, 0.55vw);              /* base unit: everything scales with the screen */
    --bg-color: #1b1b1b;
    --btn-fill: #6e6e6e;
    --btn-border: #363636;
    --btn-text: #1a1a1a;
    --knob-bg: #6e6e6e;
    --stick-outer: #2c2c2c;
    --stick-border: #444444;
    --bw: max(2px, calc(var(--u) * 0.9));
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-drag: none;
}

html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100dvh;
    overflow: hidden;
    background-color: var(--bg-color);
    color: var(--btn-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

.controller-stage {
    position: relative;
    width: 100vw; height: 100dvh;
    overflow: hidden;
    background: var(--stage-bg, var(--bg-color));
}
#ctlLayer { position: absolute; inset: 0; }

/* ===== THEMES ===== */
.theme-glass {
    --bg-color: #111111; --stage-bg: linear-gradient(160deg, #111 0%, #1a1a2e 50%, #111 100%);
    --btn-fill: rgba(255,255,255,0.08); --btn-border: rgba(255,255,255,0.22); --btn-text: rgba(255,255,255,0.75);
    --knob-bg: rgba(255,255,255,0.14); --stick-outer: rgba(255,255,255,0.05); --stick-border: rgba(255,255,255,0.18);
}
.theme-gameboy {
    --bg-color: #9bbc0f; --btn-fill: #306230; --btn-border: #0f380f; --btn-text: #9bbc0f;
    --knob-bg: #306230; --stick-outer: #8bac0f; --stick-border: #0f380f;
}
.theme-light {
    --bg-color: #e8e8ec; --btn-fill: #ffffff; --btn-border: #b9b9c4; --btn-text: #2b2b33;
    --knob-bg: #ffffff; --stick-outer: #d4d4dc; --stick-border: #b0b0bc;
}
.theme-neon {
    --bg-color: #07070d; --btn-fill: #10131f; --btn-border: #00e5ff; --btn-text: #00e5ff;
    --knob-bg: #10131f; --stick-outer: #0a0c15; --stick-border: #ff2bd6;
}
.theme-midnight {
    --bg-color: #0b1020; --btn-fill: #243256; --btn-border: #131c36; --btn-text: #cfe0ff;
    --knob-bg: #2c3d6a; --stick-outer: #131b33; --stick-border: #2a3a66;
}
.theme-crimson {
    --bg-color: #1a0b0d; --btn-fill: #7a1f2a; --btn-border: #3b0f15; --btn-text: #ffd9dc;
    --knob-bg: #8f2733; --stick-outer: #2a1215; --stick-border: #55222a;
}
.theme-neon .cbtn, .theme-neon .dpad-btn { box-shadow: 0 0 8px rgba(0,229,255,.55), inset 0 0 6px rgba(0,229,255,.25); }
.theme-neon .stick-outer { box-shadow: 0 0 10px rgba(255,43,214,.5), inset 0 0 12px rgba(255,43,214,.2); }

/* ===== CONTROL BASE ===== */
.ctl {
    position: absolute;
    z-index: 5;
    translate: -50% -50%;
    scale: calc(var(--s, 1) * var(--press, 1));
    opacity: var(--ui-opacity, 1);
    transition: scale 0.05s ease;
}

.cbtn {
    border: var(--bw) solid var(--btn-border);
    background-color: var(--fill, var(--btn-fill));
    background-image: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(0,0,0,0.14));
    color: var(--ink, var(--btn-text));
    font-weight: 900;
    font-size: calc(var(--u) * 5);
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.18), 0 4px 8px rgba(0,0,0,0.5);
    transition: filter 0.05s ease, border-color 0.1s ease;
    text-align: center;
    overflow: hidden;
    white-space: nowrap;
}
.theme-glass .cbtn { background-image: none; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 0 1px rgba(255,255,255,0.3), inset 0 1px 2px rgba(255,255,255,0.08); }
.theme-gameboy .cbtn, .theme-light .cbtn { background-image: none; }
.ctl.cbtn { width: calc(var(--u) * 15); height: calc(var(--u) * 15); }
.shape-round { border-radius: 50%; }
.shape-square { border-radius: 20%; }
.shape-wide { border-radius: 999px; }
.ctl.cbtn.shape-wide { width: calc(var(--u) * 26); height: calc(var(--u) * 12); }
.fbtn.shape-wide { border-radius: 999px; }
.cbtn svg { width: 55%; height: 55%; fill: currentColor; }
.cbtn.long { font-size: calc(var(--u) * 3.6); }

.ctl.pressed { --press: 0.92; }
.cbtn.pressed { filter: brightness(0.72); }
.cbtn.latched { border-color: #ffd23f !important; box-shadow: 0 0 14px #ffd23f, inset 0 0 8px #ffd23f !important; }
.cbtn.turbo-active { border-color: #ff9500 !important; box-shadow: 0 0 16px #ff9500, inset 0 0 8px #ff9500 !important; animation: turboPulse 0.1s infinite alternate; }
@keyframes turboPulse { 0% { filter: brightness(1.3); } 100% { filter: brightness(0.85); } }

/* face-button default accent colours (default theme only; a custom colour wins) */
.theme-default .cbtn[data-map="Y"] { --ink: #ffd23f; }
.theme-default .cbtn[data-map="X"] { --ink: #5db2ff; }
.theme-default .cbtn[data-map="B"] { --ink: #ff6b5e; }
.theme-default .cbtn[data-map="A"] { --ink: #55e070; }
.theme-default .cbtn[data-map] { text-shadow: 0 1px 2px rgba(0,0,0,.5); }

/* ===== D-PAD ===== */
.ctl.dpad { width: calc(var(--u) * 36); height: calc(var(--u) * 36); }
.dpad-btn {
    position: absolute;
    background-color: var(--btn-fill);
    border: var(--bw) solid var(--btn-border);
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.18), 0 4px 8px rgba(0,0,0,0.4);
    cursor: pointer;
}
.dpad-btn.pressed { filter: brightness(0.7); transform: scale(0.92); }
.dpad-up    { top: 0; left: 32%; width: 36%; height: 36%; border-radius: 42% 42% 14% 14%; }
.dpad-down  { bottom: 0; left: 32%; width: 36%; height: 36%; border-radius: 14% 14% 42% 42%; }
.dpad-left  { top: 32%; left: 0; width: 36%; height: 36%; border-radius: 42% 14% 14% 42%; }
.dpad-right { top: 32%; right: 0; width: 36%; height: 36%; border-radius: 14% 42% 42% 14%; }
.dpad-center { position: absolute; top: 32%; left: 32%; width: 36%; height: 36%; background-color: var(--btn-fill); border: var(--bw) solid var(--btn-border); border-radius: 14%; pointer-events: none; }
.theme-glass .dpad-btn, .theme-glass .dpad-center { background-color: rgba(255,255,255,0.06); backdrop-filter: blur(10px); }

/* ===== STICKS ===== */
.ctl.stick { width: calc(var(--u) * 38); height: calc(var(--u) * 38); }
.stick-outer {
    width: 100%; height: 100%; border-radius: 50%;
    background-color: var(--stick-outer);
    border: var(--bw) solid var(--stick-border);
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.6);
    position: relative;
    display: flex; align-items: center; justify-content: center;
}
.stick-knob {
    width: 50%; height: 50%; border-radius: 50%;
    background-color: var(--fill, var(--knob-bg));
    border: var(--bw) solid #222;
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), 0 4px 8px rgba(0,0,0,0.6);
    position: absolute;
    transition: transform 0.04s linear;
}
.theme-glass .stick-outer { backdrop-filter: blur(8px); }

/* ===== FACE CLUSTERS ===== */
.ctl.face { position: absolute; }
.face-diamond, .face-gc { width: calc(var(--u) * 38); height: calc(var(--u) * 38); }
.face-diamond .fbtn { position: absolute; width: 36%; height: 36%; font-size: calc(var(--u) * 5.5); }
.face-diamond .f0 { top: 0; left: 32%; }
.face-diamond .f1 { top: 32%; left: 0; }
.face-diamond .f2 { top: 32%; right: 0; }
.face-diamond .f3 { bottom: 0; left: 32%; }
.face-gc .fbtn { position: absolute; }
.face-gc .f0 { width: 48%; height: 48%; top: 26%; left: 26%; font-size: calc(var(--u) * 7); }
.face-gc .f1 { width: 28%; height: 28%; top: 62%; left: 0; }
.face-gc .f2 { width: 34%; height: 26%; top: 4%; left: 58%; border-radius: 30%; }
.face-gc .f3 { width: 26%; height: 34%; top: 28%; left: 78%; border-radius: 30%; }
.face-row, .face-grid { display: grid; gap: calc(var(--u) * 2); }
.face-row { grid-auto-flow: column; grid-auto-columns: calc(var(--u) * 15); }
.face-grid { grid-template-columns: repeat(3, calc(var(--u) * 15)); }
.face-row .fbtn, .face-grid .fbtn { width: calc(var(--u) * 15); height: calc(var(--u) * 15); font-size: calc(var(--u) * 5); }
.face-row.nudge .f0 { transform: translateY(calc(var(--u) * 3)); }
.fbtn { border: var(--bw) solid var(--btn-border); }

/* ===== TOUCHPAD ===== */
.ctl.touchpad {
    width: calc(var(--u) * 44); height: calc(var(--u) * 30);
    border-radius: calc(var(--u) * 3);
    background: var(--btn-fill); border: var(--bw) solid var(--btn-border);
    box-shadow: inset 0 3px 10px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    color: var(--btn-text); opacity: calc(var(--ui-opacity, 1) * .9);
    font-weight: 800; font-size: calc(var(--u) * 3.6); letter-spacing: .1em;
}
.ctl.touchpad.pressed { --press: 1; filter: brightness(1.15); }

/* ===== PLAYER PILL ===== */
.player-pill {
    position: absolute; z-index: 30;
    width: 44px; height: 44px; padding: 0; border-radius: 50%;
    background-color: #2b2b2b; border: 2px solid #444; color: #dedede;
    font-weight: 900; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: left .15s ease, top .15s ease, background-color .15s ease, border-color .15s ease, transform .1s ease;
}
.player-pill:active { transform: scale(0.93); }
.player-pill::after {
    content: ""; position: absolute; right: -2px; bottom: -2px;
    width: 11px; height: 11px; border-radius: 50%;
    background: #e5534b; border: 2px solid #1b1b1b;
}
.player-pill.connected::after { background: #4cd964; }
.player-pill.gyro-1 { border-color: #5db2ff; box-shadow: 0 0 10px #5db2ff; }
.player-pill.gyro-2 { border-color: #ffb347; box-shadow: 0 0 10px #ffb347; }

/* ===== MENU BUTTON ===== */
.menu-btn {
    position: absolute; top: max(5px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 999px;
    background: rgba(60,60,60,0.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1.5px solid rgba(255,255,255,0.14); color: #ddd;
    font-weight: 700; font-size: 12px; letter-spacing: .3px; cursor: pointer; z-index: 40; white-space: nowrap;
    max-width: 44vw; overflow: hidden; text-overflow: ellipsis;
}
.menu-btn:active { transform: translateX(-50%) scale(0.94); }
.menu-btn svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }

.rotate-hint {
    position: fixed; inset: 0; z-index: 500; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10,10,10,.94); color: #ddd; font: 700 16px/1.4 -apple-system, "Segoe UI", sans-serif; text-align: center; gap: 10px;
}
.rotate-hint .ico { font-size: 44px; }
@media (orientation: portrait) { body:not(.editing) .rotate-hint { display: flex; } }

/* ===== TOAST ===== */
.toast {
    position: fixed; left: 50%; bottom: 16px; transform: translate(-50%, 20px);
    background: rgba(20,20,20,.92); color: #fff; padding: 8px 16px; border-radius: 999px;
    font: 600 13px/1.2 -apple-system, "Segoe UI", Roboto, sans-serif;
    border: 1px solid rgba(255,255,255,.15);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 600;
    max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ===== SHEET (menu) ===== */
.sheet {
    position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    color: #eee; font: 500 14px/1.3 -apple-system, "Segoe UI", Roboto, sans-serif;
}
.sheet[hidden] { display: none; }
.sheet-panel {
    width: min(780px, 100%); max-height: 100%; display: flex; flex-direction: column;
    background: #202124; border: 1px solid rgba(255,255,255,.12); border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6); overflow: hidden;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.08); font-weight: 800; font-size: 15px; }
.sheet-body { overflow-y: auto; padding: 8px 14px 14px; }
.sheet-body, .sheet-body * { touch-action: pan-y; }
.sheet button, .sheet input, .sheet textarea, .sheet select { touch-action: manipulation; }
.sheet h4 { margin: 12px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #9aa0a6; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.chip, .sheet button {
    font: inherit; color: #eee; background: #2f3033; border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px; padding: 8px 10px; cursor: pointer; text-align: center;
}
.chip.active { background: #1f6f3a; border-color: #4cd964; color: #fff; }
.sheet button:active, .chip:active { filter: brightness(1.3); }
.sheet button.primary { background: #2b6cd4; border-color: #5b9bff; }
.sheet button.danger { background: #6b2a28; border-color: #c0463f; }
.sheet button.icon { padding: 4px 10px; }
.custom-row { display: flex; align-items: center; gap: 6px; background: #2a2b2e; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 6px 8px; }
.custom-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; cursor: pointer; padding: 4px; }
.custom-row.active { border-color: #4cd964; }
.custom-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sheet textarea, .sheet input[type=text] {
    width: 100%; background: #111; color: #eee; border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px; padding: 8px; font: 12px/1.3 ui-monospace, Consolas, monospace;
    -webkit-user-select: text; user-select: text;
}
.sheet textarea { height: 90px; resize: none; }
.empty { color: #777; font-size: 13px; padding: 4px 0 8px; }
.opt { display: flex; align-items: center; gap: 8px; width: 100%; }
.opt span { min-width: 120px; }
.opt input[type=range] { flex: 1; accent-color: #4cd964; }

/* ===== LAYOUT EDITOR ===== */
.editor-bar {
    position: fixed; left: 50%; transform: translateX(-50%); top: max(6px, env(safe-area-inset-top));
    z-index: 250; width: min(860px, calc(100vw - 12px));
    background: rgba(24,25,27,.95); border: 1px solid rgba(255,255,255,.15); border-radius: 14px;
    padding: 6px 8px; color: #eee; font: 600 12px/1.2 -apple-system, "Segoe UI", Roboto, sans-serif;
    box-shadow: 0 8px 30px rgba(0,0,0,.6);
    display: flex; flex-direction: column; gap: 6px; max-height: 70dvh; overflow-y: auto;
}
.editor-bar.dock-bottom { top: auto; bottom: max(6px, env(safe-area-inset-bottom)); }
.editor-bar[hidden] { display: none; }
.editor-bar, .editor-bar * { touch-action: manipulation; }
.editor-bar .erow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.editor-bar button, .editor-bar select {
    font: inherit; color: #eee; background: #34363a; border: 1px solid rgba(255,255,255,.12);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
}
.editor-bar button.primary { background: #2b6cd4; border-color: #5b9bff; }
.editor-bar button.danger { background: #6b2a28; border-color: #c0463f; }
.editor-bar button.on { background: #1f6f3a; border-color: #4cd964; }
.editor-bar button:disabled, .editor-bar select:disabled, .editor-bar input:disabled { opacity: .4; }
.editor-bar input[type=text] {
    flex: 1; min-width: 80px; background: #111; color: #eee; border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px; padding: 6px 8px; font: inherit; -webkit-user-select: text; user-select: text;
}
.editor-bar input.short { flex: 0 0 70px; min-width: 0; }
.editor-bar input[type=color] { width: 34px; height: 30px; padding: 0; border: 1px solid rgba(255,255,255,.2); border-radius: 6px; background: none; }
.editor-bar input[type=range] { flex: 1; min-width: 80px; accent-color: #4cd964; }
.editor-bar .sel-name { min-width: 80px; color: #4cd964; }
.editor-bar .hint { color: #9aa0a6; font-weight: 500; }
.editor-bar.collapsed .erow.extra { display: none; }
.editor-bar label.chk { display: flex; align-items: center; gap: 4px; }

.editing .ctl { pointer-events: none !important; }
.editing .player-pill, .editing .menu-btn { display: none !important; }
.editing .controller-stage {
    background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 5% 5%;
}
.editing .ctl-selected { outline: 2px dashed #4cd964; outline-offset: 5px; }
</style>
</head>
<body>
<div class="controller-stage theme-default" id="controllerStage">
    <div id="ctlLayer"></div>

    <div id="themeSwitcher" class="menu-btn" role="button" title="Menu: layouts, editor, options">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        <span id="themeLabel">Layout</span>
    </div>

    <div id="playerPill" class="player-pill" title="Player slot. Tap to cycle gyro: off / left stick / right stick">
        <span id="playerLabel">&mdash;</span>
    </div>
</div>

<div class="rotate-hint"><div class="ico">&#8635;</div><div>Rotate your phone to landscape</div></div>
<div id="toast" class="toast"></div>

<div id="sheet" class="sheet" hidden>
    <div class="sheet-panel">
        <div class="sheet-head"><span>Controller menu</span><button id="sheetClose" class="icon">&#10005;</button></div>
        <div class="sheet-body">
            <h4>My layouts</h4>
            <div id="customList" class="custom-list"></div>
            <div class="row">
                <button id="newLayout" class="primary">+ New layout from current</button>
                <button id="importBtn">Import</button>
            </div>
            <div id="ioPanel" hidden style="margin-top:8px">
                <textarea id="ioText" spellcheck="false" placeholder="Paste layout JSON here"></textarea>
                <div class="row" style="margin-top:6px">
                    <button id="ioApply" class="primary">Import pasted layout</button>
                    <button id="ioClose">Close</button>
                </div>
            </div>

            <h4>Presets</h4>
            <div id="presetGrid" class="grid"></div>

            <h4>Options</h4>
            <div class="row">
                <button id="optGyro">Gyro: Off</button>
                <button id="optHaptics">Haptics: On</button>
                <button id="optFullscreen">Fullscreen</button>
                <button id="optReconnect">Reconnect</button>
            </div>
            <div class="row" style="margin-top:8px">
                <label class="opt"><span>Stick sensitivity</span><input id="optStickSens" type="range" min="50" max="200" value="100"><b id="optStickSensVal">100%</b></label>
                <label class="opt"><span>Gyro sensitivity</span><input id="optGyroSens" type="range" min="40" max="250" value="100"><b id="optGyroSensVal">100%</b></label>
                <label class="opt"><span>Mouse speed</span><input id="optMouseSens" type="range" min="40" max="300" value="100"><b id="optMouseSensVal">100%</b></label>
            </div>
        </div>
    </div>
</div>

<div id="editorBar" class="editor-bar" hidden>
    <div class="erow">
        <input id="edName" type="text" maxlength="40" placeholder="Layout name">
        <select id="edTheme" title="Theme"></select>
        <button id="edUndo" title="Undo last change">Undo</button>
        <button id="edSnap" class="on">Snap</button>
        <button id="edCollapse" title="Show/hide tools">&#8645;</button>
        <button id="edCancel" class="danger">Cancel</button>
        <button id="edSave" class="primary">Save</button>
    </div>
    <div class="erow extra">
        <span class="sel-name" id="edSel">Tap a control</span>
        <button id="edMinus">&minus;</button>
        <input id="edSize" type="range" min="35" max="320" value="100">
        <button id="edPlus">+</button>
        <span id="edSizeVal">100%</span>
        <button id="edDup">Duplicate</button>
        <button id="edDel" class="danger">Delete</button>
    </div>
    <div class="erow extra" id="edProps"></div>
    <div class="erow extra">
        <select id="edAdd" title="Add a control"></select>
        <span>Opacity</span><input id="edOpacity" type="range" min="25" max="100" value="100">
        <span class="hint">Drag controls to move them.</span>
    </div>
</div>

<script>
(() => {
    const $ = (s, root = document) => root.querySelector(s);
    const $$ = (s, root = document) => [...root.querySelectorAll(s)];
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const round1 = v => Math.round(v * 10) / 10;
    const stage = $("#controllerStage");
    const layer = $("#ctlLayer");

    const state = {
        ws: null, connected: false, playerId: null,
        pingTimer: null, packetSeq: 0, buttonStateMask: 0,
        leftTrigger: 0, rightTrigger: 0,
        stickState: { lx: 0, ly: 0, rx: 0, ry: 0 },
        gyroModeIndex: 0, gyroCalibratedGamma: null, gyroCalibratedBeta: null,
        gyroEnabled: false, gyroReady: false, gyroLastTime: 0, gyroSmoothX: 0, gyroSmoothY: 0,
        gyroSensorSource: "none", gyroSensorSeen: false,
        sendScheduled: false, stateDirty: false, lastSentAt: 0,
        reconnectDelay: 250, reconnectTimer: null, resyncTimer: null,
        lastServerPong: 0, lastServerPongSent: 0, lastInputAt: performance.now(),
        serverLatencyMs: 0, inputHz: 120, connectionEpoch: 0,
    };

    // ---------------------------------------------------------------- settings
    const LS_SETTINGS = "controw-settings";
    const settings = { haptics: true, gyroSens: 1, stickSens: 1, mouseSens: 1 };
    try {
        const s = JSON.parse(localStorage.getItem(LS_SETTINGS) || "{}");
        if (typeof s.haptics === "boolean") settings.haptics = s.haptics;
        for (const k of ["gyroSens", "stickSens", "mouseSens"]) if (Number.isFinite(s[k])) settings[k] = clamp(s[k], 0.3, 3);
    } catch (e) {}
    function saveSettings() { try { localStorage.setItem(LS_SETTINGS, JSON.stringify(settings)); } catch (e) {} }

    // -------------------------------------------------------------------- toast
    let toastTimer = null;
    function toast(msg) {
        const t = $("#toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
    }

    // ------------------------------------------------------ stuck-input safety
    // Every press/drag handler registers a release callback here; we force-fire
    // all of them when the page loses focus so nothing can stay stuck down.
    const heldInputs = new Set();
    function releaseAllHeldInputs() {
        for (const release of [...heldInputs]) { try { release(); } catch (e) {} }
        heldInputs.clear();
    }
    window.addEventListener("blur", releaseAllHeldInputs);
    window.addEventListener("pagehide", releaseAllHeldInputs);

    // ------------------------------------------------------------------ haptics
    let vibrationUnlocked = false;
    const pendingRumble = { weak: 0, strong: 0, duration: 0, active: false };
    const activeGameRumble = { weak: 0, strong: 0 };
    let rumbleLoopTimer = null;
    let rumbleGeneration = 0;
    const RUMBLE_TICK_MS = 45;
    let lastHapticAt = 0;

    function stopGameRumble() {
        activeGameRumble.weak = 0; activeGameRumble.strong = 0;
        rumbleGeneration++;
        if (rumbleLoopTimer) { clearInterval(rumbleLoopTimer); rumbleLoopTimer = null; }
        try { if ("vibrate" in navigator) navigator.vibrate(0); } catch (_) {}
    }
    function startGameRumble(weak, strong) {
        activeGameRumble.weak = clamp(weak, 0, 1);
        activeGameRumble.strong = clamp(strong, 0, 1);
        const generation = ++rumbleGeneration;
        if (rumbleLoopTimer) clearInterval(rumbleLoopTimer);
        const tick = () => {
            if (generation !== rumbleGeneration) return;
            const w = activeGameRumble.weak, st = activeGameRumble.strong;
            if (w <= 0 && st <= 0) { stopGameRumble(); return; }
            Haptics.playDualRumble(w, st, RUMBLE_TICK_MS + 25, true);
        };
        tick();
        rumbleLoopTimer = setInterval(tick, RUMBLE_TICK_MS);
    }
    const unlockVibration = () => {
        if (vibrationUnlocked) return;
        vibrationUnlocked = true;
        if (pendingRumble.active) {
            Haptics.playDualRumble(pendingRumble.weak, pendingRumble.strong, pendingRumble.duration);
            pendingRumble.active = false;
        }
    };
    window.addEventListener("pointerdown", unlockVibration, { passive: true, once: true });
    window.addEventListener("touchstart", unlockVibration, { passive: true, once: true });

    const Haptics = {
        playDualRumble(weak = 0.5, strong = 0.5, duration = 120, persistent = false) {
            if (!settings.haptics) return;
            const now = performance.now();
            if (!persistent && now - lastHapticAt < 18 && duration < 100) return;
            lastHapticAt = now;
            const intensity = Math.max(weak, strong);
            try {
                for (const gp of (navigator.getGamepads?.() || [])) {
                    gp?.vibrationActuator?.playEffect?.("dual-rumble", { startDelay: 0, duration, weakMagnitude: weak, strongMagnitude: strong })?.catch?.(() => {});
                }
            } catch (e) {}
            if (!("vibrate" in navigator) || intensity <= 0) return;
            if (!vibrationUnlocked) {
                Object.assign(pendingRumble, { weak, strong, duration, active: true });
                return;
            }
            try {
                const pulse = Math.max(40, Math.min(Math.round(duration * intensity), 250));
                navigator.vibrate(persistent ? [pulse] : (intensity > 0.55 ? [pulse, 30, pulse] : [pulse]));
            } catch (e) {}
        },
        tick() { this.playDualRumble(0.3, 0.3, 30); },
        vibrate(pattern = 20) {
            if (!settings.haptics || !vibrationUnlocked || !("vibrate" in navigator)) return;
            try { navigator.vibrate(pattern); } catch (e) {}
        },
    };

    // ----------------------------------------------- fullscreen / wake / orient
    let wakeLock = null;
    async function requestWakeLock() {
        if ("wakeLock" in navigator && !wakeLock) {
            try { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener?.("release", () => { wakeLock = null; }); } catch (e) {}
        }
    }
    const isLandscape = () => (screen.orientation?.type ? screen.orientation.type.startsWith("landscape") : innerWidth > innerHeight);
    function requestFullscreenMode() {
        const el = document.documentElement;
        if (document.fullscreenElement || document.webkitFullscreenElement) return;
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
        try { req?.call(el)?.catch?.(() => {}); } catch (e) {}
    }
    function exitFullscreenMode() {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
            try { exit?.call(document)?.catch?.(() => {}); } catch (e) {}
        }
    }
    function handleOrientationChange() {
        if (isLandscape()) requestFullscreenMode(); else exitFullscreenMode();
    }
    screen.orientation?.addEventListener("change", handleOrientationChange);
    window.addEventListener("resize", handleOrientationChange);
    window.addEventListener("orientationchange", handleOrientationChange);
    window.addEventListener("resize", () => requestAnimationFrame(positionPlayerPill));
    window.visualViewport?.addEventListener("resize", () => positionPlayerPill());

    // Fullscreen on pointerup, never pointerdown: going fullscreen resizes the
    // page mid-touch and the browser cancels that very first press.
    window.addEventListener("pointerdown", requestWakeLock, { passive: true });
    window.addEventListener("pointerup", () => { if (isLandscape()) requestFullscreenMode(); }, { passive: true });

    // ------------------------------------------------------------- input engine
    const BTN_MASKS = {
        DPAD_UP: 0x0001, DPAD_DOWN: 0x0002, DPAD_LEFT: 0x0004, DPAD_RIGHT: 0x0008,
        START: 0x0010, BACK: 0x0020, LS: 0x0040, RS: 0x0080,
        LB: 0x0100, RB: 0x0200, GUIDE: 0x0400,
        A: 0x1000, B: 0x2000, X: 0x4000, Y: 0x8000,
    };

    // A press is held on the wire for at least this long. Games poll the pad
    // about once per frame, so a very fast tap (down+up inside one frame) was
    // never seen: that is the "needs a double click" bug.
    const MIN_PRESS_MS = 55;
    const held = new Map();   // input id -> { count, at, timer, on, val }

    function writeBit(id, pressed, val = 255) {
        const mask = BTN_MASKS[id];
        if (mask !== undefined) {
            if (pressed) state.buttonStateMask |= mask; else state.buttonStateMask &= ~mask;
        }
        if (id === "LT") state.leftTrigger = pressed ? val : 0;
        if (id === "RT") state.rightTrigger = pressed ? val : 0;
    }

    function wsSendJson(obj) {
        if (state.ws && state.ws.readyState === WebSocket.OPEN) {
            try { state.ws.send(JSON.stringify(obj)); } catch (_) {}
        }
    }

    function emit(id, pressed, val) {
        if (id.startsWith("KEY:")) wsSendJson({ type: "key", key: id.slice(4), pressed });
        else if (id.startsWith("MOUSE:")) wsSendJson({ type: "mouse_button", button: id.slice(6), pressed });
        else { writeBit(id, pressed, val); sendBinaryState(true); }
    }

    // val: trigger pull strength 1..255 (only used by LT / RT)
    function inputDown(id, val = 255) {
        let h = held.get(id);
        if (!h) { h = { count: 0, at: 0, timer: null, on: false, val }; held.set(id, h); }
        if (h.timer) { clearTimeout(h.timer); h.timer = null; }
        h.count++;
        h.val = val;
        if (!h.on) { h.on = true; h.at = performance.now(); emit(id, true, val); }
    }

    function inputUp(id, immediate = false) {
        const h = held.get(id);
        if (!h || h.count <= 0) return;
        h.count--;
        if (h.count > 0) return;
        const wait = MIN_PRESS_MS - (performance.now() - h.at);
        if (!immediate && wait > 0) {
            h.timer = setTimeout(() => { h.timer = null; if (h.count === 0) { h.on = false; emit(id, false); } }, wait);
        } else if (h.on) {
            h.on = false;
            emit(id, false);
        }
    }

    // ---------------------------------------------------------- packet sending
    function sendBinaryState(immediate = false) {
        if (!state.ws || state.ws.readyState !== WebSocket.OPEN || !state.playerId) return;
        state.stateDirty = true;
        state.lastInputAt = performance.now();
        const now = performance.now();
        const minInterval = 1000 / clamp(state.inputHz || 120, 60, 240);
        if (!immediate && (now - state.lastSentAt) < minInterval) {
            if (!state.sendScheduled) {
                state.sendScheduled = true;
                setTimeout(() => { state.sendScheduled = false; sendBinaryState(true); }, Math.max(0, minInterval - (now - state.lastSentAt)));
            }
            return;
        }
        if (!state.stateDirty) return;
        state.stateDirty = false;
        state.lastSentAt = now;
        encodeAndSendState();
    }

    function encodeAndSendState() {
        state.packetSeq = (state.packetSeq + 1) & 0xFFFF;
        const buffer = new ArrayBuffer(12);
        const view = new DataView(buffer);
        view.setUint8(0, state.playerId);
        view.setUint16(1, state.packetSeq);
        view.setUint8(3, 1);
        view.setUint16(4, state.buttonStateMask);
        view.setUint8(6, state.leftTrigger);
        view.setUint8(7, state.rightTrigger);
        view.setInt8(8, Math.round(clamp(state.stickState.lx, -1, 1) * 127));
        view.setInt8(9, Math.round(clamp(state.stickState.ly, -1, 1) * 127));
        view.setInt8(10, Math.round(clamp(state.stickState.rx, -1, 1) * 127));
        view.setInt8(11, Math.round(clamp(state.stickState.ry, -1, 1) * 127));
        try { state.ws.send(buffer); } catch (_) { try { state.ws.close(); } catch (_) {} }
    }

    // Every packet carries the complete state, so re-sending on a timer heals
    // any frame that went missing without needing more user input.
    const STATE_RESYNC_INTERVAL_MS = 200;
    function startStateResync() {
        stopStateResync();
        state.resyncTimer = setInterval(() => {
            if (!state.ws || state.ws.readyState !== WebSocket.OPEN || !state.playerId) return;
            encodeAndSendState();
        }, STATE_RESYNC_INTERVAL_MS);
    }
    function stopStateResync() {
        if (state.resyncTimer) { clearInterval(state.resyncTimer); state.resyncTimer = null; }
    }

    // ------------------------------------------------------------- connection
    const clientId = (() => {
        try {
            let id = sessionStorage.getItem("controw-client-id");
            if (!id) { id = "c" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); sessionStorage.setItem("controw-client-id", id); }
            return id;
        } catch (e) { return "c" + Math.random().toString(36).slice(2, 10); }
    })();

    function setConnection(connected, playerId = null) {
        if (!connected) stopGameRumble();
        state.connected = connected;
        if (playerId !== null && playerId !== undefined) state.playerId = Number(playerId);
        if (!connected) state.playerId = null;
        if (connected) Haptics.playDualRumble(0.5, 0.5, 60);
        if (connected) startStateResync(); else stopStateResync();
        updatePillLabel();
    }

    function startPing() {
        stopPing();
        state.pingTimer = setInterval(() => {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.lastServerPongSent = performance.now();
                state.ws.send(JSON.stringify({ type: "ping" }));
            }
            if (state.lastServerPong && performance.now() - state.lastServerPong > 7000) {
                try { state.ws.close(); } catch (_) {}
            }
        }, 2000);
    }
    function stopPing() { if (state.pingTimer) { clearInterval(state.pingTimer); state.pingTimer = null; } }

    function scheduleReconnect() {
        if (state.reconnectTimer) clearTimeout(state.reconnectTimer);
        const delay = Math.min(state.reconnectDelay + Math.random() * 150, 5000);
        state.reconnectDelay = Math.min(state.reconnectDelay * 1.7, 5000);
        state.reconnectTimer = setTimeout(() => { state.reconnectTimer = null; connect(); }, delay);
    }

    function forceReconnect() {
        if (state.reconnectTimer) { clearTimeout(state.reconnectTimer); state.reconnectTimer = null; }
        state.reconnectDelay = 250;
        const old = state.ws;
        state.ws = null;              // detaches the old socket's handlers (guards below)
        if (old) { try { old.close(); } catch (_) {} }
        stopPing();
        setConnection(false);
        connect();
    }

    function connect() {
        if (state.ws && (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING)) return;
        let ws;
        try {
            const protocol = location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(`${protocol}//${location.host}/ws?cid=${encodeURIComponent(clientId)}`);
        } catch (e) { setConnection(false); scheduleReconnect(); return; }
        state.ws = ws;
        ws.binaryType = "arraybuffer";

        // Handlers ignore events from a socket that is no longer state.ws; a
        // late "close" from an old socket must not tear down the new one.
        ws.addEventListener("open", () => {
            if (state.ws !== ws) return;
            state.connectionEpoch++;
            state.reconnectDelay = 250;
            state.lastServerPong = performance.now();
            startPing();
        });
        ws.addEventListener("close", () => {
            if (state.ws !== ws) return;
            setConnection(false);
            stopPing();
            scheduleReconnect();
        });
        ws.addEventListener("error", () => { if (state.ws === ws) { try { ws.close(); } catch (_) {} } });
        ws.addEventListener("message", event => {
            if (state.ws !== ws) return;
            try {
                if (typeof event.data !== "string") return;
                const msg = JSON.parse(event.data);
                if (msg.type === "welcome" && msg.player_id) {
                    setConnection(true, msg.player_id);
                    state.packetSeq = 0;
                    state.connectionEpoch++;
                    state.stateDirty = true;      // keep local input: a press landing right at welcome must survive
                    sendBinaryState(true);
                } else if (msg.type === "pong") {
                    const t = performance.now();
                    state.serverLatencyMs = Math.max(0, t - state.lastServerPongSent);
                    state.lastServerPong = t;
                } else if (msg.type === "server_full") {
                    state.reconnectDelay = 3000;
                    toast("Server is full (" + msg.max_players + " players max)");
                } else if (msg.type === "controller_unavailable") {
                    toast("Virtual controller unavailable - is ViGEmBus installed?");
                } else if (msg.type === "rumble") {
                    const large = clamp(Number(msg.large) || 0, 0, 255);
                    const small = clamp(Number(msg.small) || 0, 0, 255);
                    if (large === 0 && small === 0) stopGameRumble(); else startGameRumble(small / 255, large / 255);
                }
            } catch (e) {}
        });
    }

    let hiddenAt = 0;
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) { hiddenAt = performance.now(); releaseAllHeldInputs(); return; }
        const away = hiddenAt ? performance.now() - hiddenAt : 0;
        hiddenAt = 0;
        if (!state.ws || state.ws.readyState !== WebSocket.OPEN || away > 4000) forceReconnect();
    });
    window.addEventListener("online", () => { if (!state.ws || state.ws.readyState !== WebSocket.OPEN) forceReconnect(); });
    window.addEventListener("pageshow", e => { if (e.persisted) forceReconnect(); });

    // -------------------------------------------------------- player pill + gyro
    function rectsOverlap(a, b, gap = 6) {
        return !(a.right + gap <= b.left || a.left - gap >= b.right || a.bottom + gap <= b.top || a.top - gap >= b.bottom);
    }

    function positionPlayerPill() {
        const pill = $("#playerPill");
        if (!pill) return;
        const margin = Math.max(8, Math.round(innerWidth * 0.015));
        const top0 = Math.max(8, (window.visualViewport && window.visualViewport.offsetTop) || 0) + margin;
        const w = pill.offsetWidth, h = pill.offsetHeight;
        const cands = [
            { left: innerWidth - w - margin, top: top0 },
            { left: margin, top: top0 },
            { left: Math.round((innerWidth - w) / 2) + 90, top: top0 },
            { left: innerWidth - w - margin, top: innerHeight - h - margin },
            { left: margin, top: innerHeight - h - margin },
            { left: innerWidth - w - margin, top: top0 + h + 8 },
            { left: margin, top: top0 + h + 8 },
        ];
        const obstacles = $$(".ctl, #themeSwitcher");
        for (const c of cands) {
            const r = { left: c.left, right: c.left + w, top: c.top, bottom: c.top + h };
            if (!obstacles.some(el => rectsOverlap(r, el.getBoundingClientRect()))) {
                pill.style.left = c.left + "px"; pill.style.top = c.top + "px";
                return;
            }
        }
        pill.style.left = (innerWidth - w - margin) + "px";
        pill.style.top = top0 + "px";
    }

    function updatePillLabel() {
        const pill = $("#playerPill");
        pill.classList.toggle("gyro-1", state.gyroModeIndex === 1);
        pill.classList.toggle("gyro-2", state.gyroModeIndex === 2);
        if (!state.connected || !state.playerId) {
            pill.classList.remove("connected");
            $("#playerLabel").textContent = "—";
        } else {
            pill.classList.add("connected");
            $("#playerLabel").textContent = String(Number(state.playerId));
        }
        positionPlayerPill();
    }

    const sticksOf = side => $$(`.ctl.stick[data-map="${side}"]`);

    function updateKnobVisual(container, x, y) {
        if (!container) return;
        const knob = $(".stick-knob", container);
        if (!knob) return;
        const maxTranslate = Math.max(0, Math.min(container.clientWidth, container.clientHeight) * 0.38);
        knob.style.transform = `translate3d(${x * maxTranslate}px, ${y * maxTranslate}px, 0)`;
    }
    function setKnobs(side, x, y) { for (const el of sticksOf(side)) updateKnobVisual(el, x, y); }

    let gyroListenersInstalled = false;
    function installGyroListeners() {
        if (gyroListenersInstalled) return;
        gyroListenersInstalled = true;
        addEventListener("deviceorientation", handleOrientation, { passive: true });
        addEventListener("deviceorientationabsolute", handleOrientation, { passive: true });
        addEventListener("devicemotion", handleMotion, { passive: true });
    }

    async function requestGyroPermission() {
        try {
            if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
                if ((await DeviceOrientationEvent.requestPermission()) !== "granted") return false;
            }
            if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
                if ((await DeviceMotionEvent.requestPermission()) !== "granted") return false;
            }
            return true;
        } catch (e) { return false; }
    }

    function resetGyroCalibration() {
        state.gyroCalibratedGamma = null; state.gyroCalibratedBeta = null;
        state.gyroSmoothX = 0; state.gyroSmoothY = 0; state.gyroLastTime = 0;
        state.gyroSensorSource = "none"; state.gyroSensorSeen = false;
    }

    async function enableGyro() {
        if (!window.isSecureContext && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
            state.gyroReady = false; state.gyroEnabled = false;
            toast("Gyro needs HTTPS on most phones");
            return false;
        }
        if (typeof DeviceOrientationEvent === "undefined" && typeof DeviceMotionEvent === "undefined") {
            state.gyroReady = false; state.gyroEnabled = false;
            toast("This device has no motion sensors");
            return false;
        }
        if (!(await requestGyroPermission())) { state.gyroReady = false; state.gyroEnabled = false; return false; }
        installGyroListeners();
        state.gyroReady = true; state.gyroEnabled = true;
        resetGyroCalibration();
        return true;
    }

    async function cycleGyroMode() {
        state.gyroModeIndex = (state.gyroModeIndex + 1) % 3;
        if (state.gyroModeIndex !== 0) {
            if (!(await enableGyro())) state.gyroModeIndex = 0;
        } else { state.gyroReady = false; state.gyroEnabled = false; }
        resetGyroCalibration();
        if (state.gyroModeIndex !== 2) { state.stickState.lx = 0; state.stickState.ly = 0; setKnobs("L", 0, 0); }
        if (state.gyroModeIndex !== 1) { state.stickState.rx = 0; state.stickState.ry = 0; setKnobs("R", 0, 0); }
        updatePillLabel();
        sendBinaryState();
    }

    $("#playerPill").addEventListener("pointerup", e => {
        if (editing) return;
        e.preventDefault(); e.stopPropagation();
        cycleGyroMode();
    });

    function applyGyro(x, y, source) {
        if (state.gyroModeIndex === 0 || !state.gyroReady) return;
        state.gyroSensorSeen = true;
        state.gyroSensorSource = source;
        if (state.gyroCalibratedGamma === null || state.gyroCalibratedBeta === null) {
            state.gyroCalibratedGamma = x; state.gyroCalibratedBeta = y;
            state.gyroSmoothX = 0; state.gyroSmoothY = 0;
            return;
        }
        const angle = ((screen.orientation?.angle ?? window.orientation ?? 0) + 360) % 360;
        let gx = x - state.gyroCalibratedGamma;
        let gy = y - state.gyroCalibratedBeta;
        if (angle === 90) [gx, gy] = [gy, -gx];
        else if (angle === 180) { gx = -gx; gy = -gy; }
        else if (angle === 270) [gx, gy] = [-gy, gx];

        const dead = 1.2;
        if (Math.abs(gx) < dead) gx = 0;
        if (Math.abs(gy) < dead) gy = 0;
        const range = 22 / settings.gyroSens;
        let tx = clamp(gx / range, -1, 1), ty = clamp(gy / range, -1, 1);
        const curve = v => Math.sign(v) * Math.abs(v) * Math.abs(v) * (3 - 2 * Math.abs(v));
        tx = curve(tx); ty = curve(ty);
        const mag = Math.max(Math.abs(tx), Math.abs(ty));
        const alpha = mag > 0.65 ? 0.52 : mag > 0.25 ? 0.36 : 0.22;
        state.gyroSmoothX += (tx - state.gyroSmoothX) * alpha;
        state.gyroSmoothY += (ty - state.gyroSmoothY) * alpha;
        driveGyroStick(clamp(state.gyroSmoothX, -1, 1), clamp(state.gyroSmoothY, -1, 1));
        const now = performance.now();
        if (now - state.gyroLastTime >= 12) { state.gyroLastTime = now; sendBinaryState(); }
    }

    function driveGyroStick(sx, sy) {
        if (state.gyroModeIndex === 1) { state.stickState.lx = sx; state.stickState.ly = sy; setKnobs("L", sx, sy); }
        else { state.stickState.rx = sx; state.stickState.ry = sy; setKnobs("R", sx, sy); }
    }

    function handleOrientation(e) {
        if (Number.isFinite(e.gamma) && Number.isFinite(e.beta)) applyGyro(e.gamma, e.beta, "orientation");
    }
    function handleMotion(e) {
        const r = e.rotationRate;
        if (!r || !Number.isFinite(r.alpha) || !Number.isFinite(r.beta) || !Number.isFinite(r.gamma)) return;
        if (state.gyroSensorSeen && state.gyroSensorSource === "orientation") return;
        if (state.gyroModeIndex === 0 || !state.gyroReady) return;

    const THEME_IDS = THEMES.map(t => t[0]);

    const newLayoutId = () => "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    function migrateV1(l) {

        const mapTo = { dpad: ["dpad"], lstick: ["L"], rstick: ["R"], abxy: ["face:xbox"], lb: ["LB"], lt: ["LT"], rb: ["RB"], rt: ["RT"],
                        ls: ["LS"], rs: ["RS"], back: ["BACK"], start: ["START"], guide: ["GUIDE"] };
        const entries = [];
        for (const [k, v] of Object.entries(l.controls || {})) {
            if (!mapTo[k] || !v || v.hidden) continue;
            entries.push([mapTo[k][0], Number(v.x), Number(v.y), Number(v.s) || 1]);
        }
        return { id: l.id, name: l.name, theme: l.glass ? "glass" : "default", opacity: l.opacity,
                 controls: entries.map(e => makeControl(e[0], e[1], e[2], e[3])) };

                if (Array.isArray(v.colors)) c.colors = v.colors.slice(0, 6).map(t => (COLOR_RE.test(t) ? t : ""));
