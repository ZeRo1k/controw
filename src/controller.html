            bindDpad(el);
        } else if (c.type === "stick") {
            el = mkEl("ctl stick");
            el.dataset.map = c.map;
            el.innerHTML = '<div class="stick-outer"><div class="stick-knob"></div></div>';
            applyColor(el, c.color);
            bindStick(el, c);
        } else if (c.type === "face") {
            el = mkEl("ctl face face-" + c.style);
            c.maps.forEach((map, i) => {
                const b = mkEl("cbtn fbtn f" + i + " shape-" + (c.shape || (c.style === "gc" && (i === 2 || i === 3) ? "square" : "round")));
                b.dataset.map = map;
                setBtnContent(b, map, c.labels && c.labels[i] ? c.labels[i] : "");
                applyColor(b, (c.colors && c.colors[i]) || c.color);
                el.appendChild(b);
                bindButton(b, el, c, map);
            });
        } else if (c.type === "touchpad") {
            el = mkEl("ctl touchpad");
            el.textContent = c.label || "MOUSE";
            bindTouchpad(el, c);
        }
        el.dataset.cid = c.id;
        placeControl(el, c);
        return el;
    }

    function placeControl(el, c) {
        el.style.left = c.x + "%";
        el.style.top = c.y + "%";
        el.style.setProperty("--s", String(c.s));
    }

    function renderLayout(layout) {
        releaseAllHeldInputs();
        layer.textContent = "";
        ctlEls.clear();
        for (const c of layout.controls) {
            const el = buildControl(c);
            layer.appendChild(el);
            ctlEls.set(c.id, el);
        }
        state.stickState.lx = state.stickState.ly = state.stickState.rx = state.stickState.ry = 0;
        sendBinaryState(true);
    }

    function refreshControl(c) {
        const old = ctlEls.get(c.id);
        const el = buildControl(c);
        if (old) old.replaceWith(el); else layer.appendChild(el);
        ctlEls.set(c.id, el);
        if (editing && editing.selected === c.id) el.classList.add("ctl-selected");
    }

    function applyTheme(layout) {
        for (const cls of [...stage.classList]) if (cls.startsWith("theme-")) stage.classList.remove(cls);
        stage.classList.add("theme-" + layout.theme);
        stage.style.setProperty("--ui-opacity", String(layout.opacity));
    }

    // ---------------------------------------------------------------- binders
    const TRIPLE_TAP_WINDOW_MS = 500;
    const TURBO_HOLD_MS = 1000;
    const TURBO_INTERVAL_MS = 45;

    // `el` receives the pointer events, `visual` is the element that gets the pressed look.
    function bindButton(el, host, c, map) {
        const latch = !!c.latch;
        const trigVal = Math.round(255 * clamp((c.value ?? 100) / 100, 0.05, 1));
        let tapCount = 0, lastTapTime = 0, holdTimer = null;
        let turboActive = false, turboInterval = null, latched = false;
        let activePointerId = null;
        const visual = el;

        const stopTurbo = () => {
            if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
            if (turboInterval) { clearInterval(turboInterval); turboInterval = null; }
            turboActive = false;
            visual.classList.remove("turbo-active");
        };
        const startTurbo = () => {
            if (turboActive) return;
            turboActive = true;
            visual.classList.add("turbo-active");
            Haptics.playDualRumble(0.8, 0.8, 70);
            let on = true;
            turboInterval = setInterval(() => {
                if (!turboActive) return;
                on = !on;
                emit(map, on, trigVal);
                if (on) Haptics.vibrate(10);
            }, TURBO_INTERVAL_MS);
        };

        const release = e => {
            if (e) {
                if (activePointerId !== e.pointerId) return;
                e.preventDefault(); e.stopPropagation();
            } else if (latched) {
                latched = false;
                visual.classList.remove("latched");
                inputUp(map, true);
            }
            const wasDown = activePointerId !== null;
            activePointerId = null;
            heldInputs.delete(release);
            visual.classList.remove("pressed");
            host.classList.remove("pressed");
            stopTurbo();
            if (!latch && wasDown) inputUp(map);
            const seq = tapCount;
            setTimeout(() => { if (tapCount === seq && Date.now() - lastTapTime > TRIPLE_TAP_WINDOW_MS) tapCount = 0; }, TRIPLE_TAP_WINDOW_MS + 25);
        };

        const press = e => {
            if (editing) return;
            if (e.pointerType === "mouse" && e.button !== 0) return;
            // Self-heal: a stale "down" (lost release) must never swallow a new tap.
            if (activePointerId !== null) release();
            e.preventDefault(); e.stopPropagation();
            activePointerId = e.pointerId;
            try { el.setPointerCapture?.(e.pointerId); } catch (_) {}
            heldInputs.add(release);
            visual.classList.add("pressed");
            if (host === el) { /* standalone: host is the element itself */ }
            else host.classList.add("pressed");
            Haptics.tick();

            if (latch) {
                if (latched) { latched = false; visual.classList.remove("latched"); inputUp(map, true); }
                else { latched = true; visual.classList.add("latched"); inputDown(map, trigVal); }
                return;
            }
            inputDown(map, trigVal);
            if (c.turbo) { startTurbo(); return; }

            const now = Date.now();
            if (now - lastTapTime > TRIPLE_TAP_WINDOW_MS) tapCount = 0;
            tapCount++;
            lastTapTime = now;
            if (tapCount === 3) {
                if (holdTimer) clearTimeout(holdTimer);
                holdTimer = setTimeout(() => { holdTimer = null; startTurbo(); }, TURBO_HOLD_MS);
            } else if (tapCount > 3) tapCount = 1;
        };

        el.addEventListener("pointerdown", press);
        el.addEventListener("pointerup", release);
        el.addEventListener("pointercancel", release);
        el.addEventListener("lostpointercapture", release);
    }

    function bindDpad(el) {
        let activePointerId = null;
        let active = new Set();

        const directionFromPoint = (cx, cy) => {
            const r = el.getBoundingClientRect();
            const x = cx - (r.left + r.width / 2);
            const y = cy - (r.top + r.height / 2);
            if (Math.abs(x) > r.width * 0.55 || Math.abs(y) > r.height * 0.55) return new Set();
            if (Math.hypot(x / (r.width * 0.5), y / (r.height * 0.5)) < 0.22) return new Set();
            const a = Math.atan2(y, x) * 180 / Math.PI;
            const d = new Set();
            if (a >= -22.5 && a < 22.5) d.add("DPAD_RIGHT");
            else if (a >= 22.5 && a < 67.5) { d.add("DPAD_RIGHT"); d.add("DPAD_DOWN"); }
            else if (a >= 67.5 && a < 112.5) d.add("DPAD_DOWN");
            else if (a >= 112.5 && a < 157.5) { d.add("DPAD_LEFT"); d.add("DPAD_DOWN"); }
            else if (a >= 157.5 || a < -157.5) d.add("DPAD_LEFT");
            else if (a >= -157.5 && a < -112.5) { d.add("DPAD_LEFT"); d.add("DPAD_UP"); }
            else if (a >= -112.5 && a < -67.5) d.add("DPAD_UP");
            else { d.add("DPAD_RIGHT"); d.add("DPAD_UP"); }
            return d;
        };

        const visual = (dir, on) => el.querySelector(`[data-dir="${dir}"]`)?.classList.toggle("pressed", on);

        const apply = next => {
            for (const d of active) if (!next.has(d)) { inputUp(d, true); visual(d, false); }
            for (const d of next) if (!active.has(d)) { inputDown(d); visual(d, true); Haptics.tick(); }
            active = new Set(next);
        };

        const end = e => {
            if (e) {
                if (activePointerId !== e.pointerId) return;
                e.preventDefault();
            }
            activePointerId = null;
            heldInputs.delete(end);
            for (const d of active) { inputUp(d); visual(d, false); }
            active.clear();
        };

        el.addEventListener("pointerdown", e => {
            if (editing) return;
            if (activePointerId !== null) end();
            e.preventDefault(); e.stopPropagation();
            activePointerId = e.pointerId;
            try { el.setPointerCapture?.(e.pointerId); } catch (_) {}
            heldInputs.add(end);
            apply(directionFromPoint(e.clientX, e.clientY));
        });
        el.addEventListener("pointermove", e => {
            if (activePointerId !== e.pointerId) return;
            e.preventDefault();
            apply(directionFromPoint(e.clientX, e.clientY));
        });
        el.addEventListener("pointerup", end);
        el.addEventListener("pointercancel", end);
        el.addEventListener("lostpointercapture", end);
    }

    function bindStick(el, c) {
        const side = c.map;
        const sens = (c.sens ?? 1);
        let pointerId = null;
        let raf = null;

        const write = (x, y) => {
            const gyroOwns = (side === "R" && state.gyroModeIndex === 2) || (side === "L" && state.gyroModeIndex === 1);
            if (gyroOwns) return;
            if (side === "R") { state.stickState.rx = x; state.stickState.ry = y; }
            else { state.stickState.lx = x; state.stickState.ly = y; }
        };

        const move = e => {
            if (pointerId !== e.pointerId) return;
            e.preventDefault();
            const r = el.getBoundingClientRect();
            const dx = e.clientX - (r.left + r.width / 2);
            const dy = e.clientY - (r.top + r.height / 2);
            const dist = Math.hypot(dx, dy) || 1;
            const radius = r.width * 0.38;
            const k = Math.min(1, radius / dist);
            let x = (dx * k) / radius, y = (dy * k) / radius;
            updateKnobVisual(el, x, y);
            const gain = sens * settings.stickSens;
            x = clamp(x * gain, -1, 1); y = clamp(y * gain, -1, 1);
            if (raf) cancelAnimationFrame(raf);
            raf = requestAnimationFrame(() => { raf = null; write(x, y); sendBinaryState(); });
        };

        const end = e => {
            if (e) { if (pointerId !== e.pointerId) return; }
            pointerId = null;
            heldInputs.delete(end);
            if (raf) { cancelAnimationFrame(raf); raf = null; }
            const gyroOwns = (side === "R" && state.gyroModeIndex === 2) || (side === "L" && state.gyroModeIndex === 1);
            if (!gyroOwns) { updateKnobVisual(el, 0, 0); write(0, 0); }
            sendBinaryState(true);
        };

        el.addEventListener("pointerdown", e => {
            if (editing) return;
            e.preventDefault();
            if (pointerId !== null) end();
            pointerId = e.pointerId;
            try { el.setPointerCapture?.(e.pointerId); } catch (_) {}
            heldInputs.add(end);
            move(e);
        });
        el.addEventListener("pointermove", move);
        el.addEventListener("pointerup", end);
        el.addEventListener("pointercancel", end);
        el.addEventListener("lostpointercapture", end);
    }

    function bindTouchpad(el, c) {
        let pointerId = null, lastX = 0, lastY = 0, startX = 0, startY = 0, startT = 0, moved = false;
        let accX = 0, accY = 0, raf = null;

        const flush = () => {
            raf = null;
            const dx = Math.round(accX), dy = Math.round(accY);
            if (dx || dy) { accX -= dx; accY -= dy; wsSendJson({ type: "mouse_move", dx, dy }); }
        };
        const end = e => {
            if (e && pointerId !== e.pointerId) return;
            if (pointerId !== null && !moved && performance.now() - startT < 250) {
                wsSendJson({ type: "mouse_button", button: "left", pressed: true });
                setTimeout(() => wsSendJson({ type: "mouse_button", button: "left", pressed: false }), 40);
                Haptics.tick();
            }
            pointerId = null;
            heldInputs.delete(end);
            el.classList.remove("pressed");
        };
        el.addEventListener("pointerdown", e => {
            if (editing || pointerId !== null) return;
            e.preventDefault(); e.stopPropagation();
            pointerId = e.pointerId;
            try { el.setPointerCapture?.(e.pointerId); } catch (_) {}
            heldInputs.add(end);
            lastX = startX = e.clientX; lastY = startY = e.clientY;
            startT = performance.now(); moved = false;
            el.classList.add("pressed");
        });
        el.addEventListener("pointermove", e => {
            if (pointerId !== e.pointerId) return;
            e.preventDefault();
            if (Math.hypot(e.clientX - startX, e.clientY - startY) > 8) moved = true;
            const k = 1.6 * settings.mouseSens * (c.sens ?? 1);
            accX += (e.clientX - lastX) * k; accY += (e.clientY - lastY) * k;
            lastX = e.clientX; lastY = e.clientY;
            if (!raf) raf = requestAnimationFrame(flush);
        });
        el.addEventListener("pointerup", end);
        el.addEventListener("pointercancel", end);
        el.addEventListener("lostpointercapture", end);
    }

    // PC keyboard shortcuts for testing the page on a desktop
    const keyMap = { w: "DPAD_UP", s: "DPAD_DOWN", a: "DPAD_LEFT", d: "DPAD_RIGHT", " ": "A", e: "B", q: "X", r: "Y", Shift: "LB", Control: "RB",
                     ArrowUp: "DPAD_UP", ArrowDown: "DPAD_DOWN", ArrowLeft: "DPAD_LEFT", ArrowRight: "DPAD_RIGHT" };
    const activeKeys = new Set();
    addEventListener("keydown", e => {
        if (editing || e.repeat || !keyMap[e.key] || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
        activeKeys.add(e.key);
        inputDown(keyMap[e.key]);
    });
    addEventListener("keyup", e => {
        if (!activeKeys.has(e.key)) return;
        activeKeys.delete(e.key);
        inputUp(keyMap[e.key]);
    });
    addEventListener("contextmenu", e => e.preventDefault());

    // ================================================================ LAYOUT MANAGER
    const LS_CUSTOM = "controw-layouts-v2";
    const LS_CUSTOM_V1 = "controw-custom-layouts";
    const LS_ACTIVE = "controw-active-layout";

    let customLayouts = [];
    let active = null;        // layout currently shown
    let editing = null;       // editor session

    function loadCustomLayouts() {
        customLayouts = [];
        try {
            let raw = localStorage.getItem(LS_CUSTOM);
            if (raw === null) raw = localStorage.getItem(LS_CUSTOM_V1);   // one-time migration
            const arr = JSON.parse(raw || "[]");
            if (Array.isArray(arr)) customLayouts = arr.map(sanitizeLayout).filter(Boolean);
        } catch (e) {}
    }
    function saveCustomLayouts() {
        try { localStorage.setItem(LS_CUSTOM, JSON.stringify(customLayouts)); }
        catch (e) { toast("Could not save (storage blocked)"); }
    }

    function showLayout(layout, remember = true) {
        active = layout;
        applyTheme(layout);
        renderLayout(layout);
        $("#themeLabel").textContent = layout.name;
        if (remember) { try { localStorage.setItem(LS_ACTIVE, layout.id); } catch (e) {} }
        requestAnimationFrame(positionPlayerPill);
    }

    function findLayout(id) { return PRESETS.find(p => p.id === id) || customLayouts.find(l => l.id === id); }

    function restoreLayout() {
        loadCustomLayouts();
        let id = null;
        try { id = localStorage.getItem(LS_ACTIVE); } catch (e) {}
        showLayout(findLayout(id) || PRESETS[0], false);
    }

    // ---- menu sheet
    const sheet = $("#sheet");
    function openSheet() { renderSheet(); sheet.hidden = false; }
    function closeSheet() { sheet.hidden = true; $("#ioPanel").hidden = true; }
    const gyroLabel = () => ["Off", "Left stick", "Right stick"][state.gyroModeIndex] || "Off";

    function renderSheet() {
        const grid = $("#presetGrid");
        grid.textContent = "";
        for (const p of PRESETS) {
            const b = mkEl("chip" + (active && active.id === p.id ? " active" : ""), "button");
            b.textContent = p.name;
            b.addEventListener("click", () => { showLayout(p); closeSheet(); Haptics.tick(); });
            grid.appendChild(b);
        }
        const list = $("#customList");
        list.textContent = "";
        if (!customLayouts.length) {
            const e = mkEl("empty");
            e.textContent = "No custom layouts yet. Choose a preset you like, then tap \"New layout from current\".";
            list.appendChild(e);
        }
        for (const l of customLayouts) {
            const row = mkEl("custom-row" + (active && active.id === l.id ? " active" : ""));
            const nm = mkEl("nm");
            nm.textContent = l.name;
            nm.addEventListener("click", () => { showLayout(l); closeSheet(); });
            row.appendChild(nm);
            const mk = (txt, cls, fn) => { const b = mkEl("icon " + cls, "button"); b.textContent = txt; b.addEventListener("click", fn); row.appendChild(b); };
            mk("Edit", "", () => { closeSheet(); startEditing(l); });
            mk("Copy", "", () => duplicateLayout(l));
            mk("Share", "", () => exportLayout(l));
            mk("Delete", "danger", () => deleteLayout(l));
            list.appendChild(row);
        }
        $("#optGyro").textContent = "Gyro: " + gyroLabel();
        $("#optHaptics").textContent = "Haptics: " + (settings.haptics ? "On" : "Off");
        const fs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        $("#optFullscreen").textContent = fs ? "Exit fullscreen" : "Fullscreen";
        for (const [id, key, val] of [["optStickSens", "stickSens", "optStickSensVal"], ["optGyroSens", "gyroSens", "optGyroSensVal"], ["optMouseSens", "mouseSens", "optMouseSensVal"]]) {
            $("#" + id).value = Math.round(settings[key] * 100);
            $("#" + val).textContent = Math.round(settings[key] * 100) + "%";
        }
    }

    for (const [id, key, val] of [["optStickSens", "stickSens", "optStickSensVal"], ["optGyroSens", "gyroSens", "optGyroSensVal"], ["optMouseSens", "mouseSens", "optMouseSensVal"]]) {
        $("#" + id).addEventListener("input", e => {
            settings[key] = Number(e.target.value) / 100;
            $("#" + val).textContent = e.target.value + "%";
            saveSettings();
        });
    }

    function duplicateLayout(l) {
        const copy = cloneLayout(l);
        copy.id = newLayoutId();
        copy.name = (l.name + " copy").slice(0, 40);
        customLayouts.push(sanitizeLayout(copy));
        saveCustomLayouts();
        renderSheet();
    }
    function deleteLayout(l) {
        if (!confirm('Delete layout "' + l.name + '"?')) return;
        customLayouts = customLayouts.filter(x => x.id !== l.id);
        saveCustomLayouts();
        if (active && active.id === l.id) showLayout(PRESETS[0]);
        renderSheet();
    }
    function exportLayout(l) {
        const ta = $("#ioText");
        ta.value = JSON.stringify(l);
        $("#ioPanel").hidden = false;
        $("#ioApply").hidden = true;
        ta.focus(); ta.select();
        try {
            if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(ta.value).then(() => toast("Copied to clipboard"), () => {});
            else if (document.execCommand && document.execCommand("copy")) toast("Copied to clipboard");
        } catch (e) {}
    }
    $("#importBtn").addEventListener("click", () => {
        $("#ioText").value = "";
        $("#ioApply").hidden = false;
        $("#ioPanel").hidden = false;
        $("#ioText").focus();
    });
    $("#ioClose").addEventListener("click", () => { $("#ioPanel").hidden = true; });
    $("#ioApply").addEventListener("click", () => {
        try {
            const l = sanitizeLayout(JSON.parse($("#ioText").value));
            if (!l || !l.controls.length) throw new Error("bad");
            l.id = newLayoutId();
            customLayouts.push(l);
            saveCustomLayouts();
            $("#ioPanel").hidden = true;
            renderSheet();
            toast('Imported "' + l.name + '"');
        } catch (e) { toast("That is not a valid layout"); }
    });

    $("#newLayout").addEventListener("click", () => {
        closeSheet();
        const base = cloneLayout(active);
        base.id = newLayoutId();
        base.name = active.preset ? (active.name + " custom").slice(0, 40) : "My layout " + (customLayouts.length + 1);
        delete base.preset;
        startEditing(base);
    });

    $("#themeSwitcher").addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); openSheet(); });
    $("#sheetClose").addEventListener("click", closeSheet);
    sheet.addEventListener("pointerdown", e => { if (e.target === sheet) closeSheet(); });

    $("#optGyro").addEventListener("click", async () => { await cycleGyroMode(); renderSheet(); });
    $("#optHaptics").addEventListener("click", () => {
        settings.haptics = !settings.haptics;
        saveSettings();
        if (!settings.haptics) stopGameRumble();
        renderSheet();
    });
    $("#optFullscreen").addEventListener("click", () => {
        if (document.fullscreenElement || document.webkitFullscreenElement) exitFullscreenMode(); else requestFullscreenMode();
        setTimeout(renderSheet, 300);
    });
    $("#optReconnect").addEventListener("click", () => { forceReconnect(); toast("Reconnecting..."); closeSheet(); });

    // ---- editor
    const bar = $("#editorBar");
    const edName = $("#edName"), edSize = $("#edSize"), edOpacity = $("#edOpacity"), edTheme = $("#edTheme"), edAdd = $("#edAdd");

    for (const [id, name] of THEMES) { const o = document.createElement("option"); o.value = id; o.textContent = "Theme: " + name; edTheme.appendChild(o); }

    function addGroup(select, label, items) {
        const g = document.createElement("optgroup");
        g.label = label;
        for (const [v, t] of items) { const o = document.createElement("option"); o.value = v; o.textContent = t; g.appendChild(o); }
        select.appendChild(g);
    }
    (function buildAddMenu() {
        const ph = document.createElement("option");
        ph.value = ""; ph.textContent = "+ Add control...";
        edAdd.appendChild(ph);
        addGroup(edAdd, "Sticks & pads", [["dpad", "D-pad"], ["L", "Left stick"], ["R", "Right stick"], ["tp", "Touchpad (mouse)"]]);
        addGroup(edAdd, "Button groups", Object.keys(FACE).map(k => ["face:" + k, FACE_NAMES[k]]));
        addGroup(edAdd, "Gamepad buttons", GAMEPAD_MAPS.map(m => ["b:" + m, mapDisplayName(m)]));
        addGroup(edAdd, "Keyboard keys", [...SPECIAL_KEYS, ...LETTER_KEYS].map(k => ["b:KEY:" + k, "Key: " + (KEY_LABELS[k] || k.toUpperCase())]));
        addGroup(edAdd, "Mouse buttons", MOUSE_BTNS.map(m => ["b:MOUSE:" + m, "Mouse: " + MOUSE_LABELS[m]]));
    })();

    function mapSelect(current, onChange) {
        const s = document.createElement("select");
        addGroup(s, "Gamepad", GAMEPAD_MAPS.map(m => [m, mapDisplayName(m)]));
        addGroup(s, "Keyboard", [...SPECIAL_KEYS, ...LETTER_KEYS].map(k => ["KEY:" + k, "Key: " + (KEY_LABELS[k] || k.toUpperCase())]));
        addGroup(s, "Mouse", MOUSE_BTNS.map(m => ["MOUSE:" + m, "Mouse: " + MOUSE_LABELS[m]]));
        s.value = current;
        s.addEventListener("change", () => onChange(s.value));
        return s;
    }

    // undo history
    const undoStack = [];
    function pushUndo() {
        if (!editing) return;
        undoStack.push(cloneLayout(editing.layout));
        if (undoStack.length > 60) undoStack.shift();
        $("#edUndo").disabled = false;
    }

    function startEditing(source) {
        releaseAllHeldInputs();
        const working = sanitizeLayout(source) || cloneLayout(PRESETS[0]);
        working.id = source.id;
        editing = { layout: working, original: cloneLayout(working), returnTo: active, selected: null, snap: true, drag: null };
        undoStack.length = 0;
        $("#edUndo").disabled = true;
        document.body.classList.add("editing");
        bar.hidden = false;
        bar.classList.remove("collapsed");
        edName.value = working.name;
        edTheme.value = working.theme;
        edOpacity.value = Math.round(working.opacity * 100);
        $("#edSnap").classList.add("on");
        active = working;
        applyTheme(working);
        renderLayout(working);
        selectControl(null);
    }

    function stopEditing() {
        editing = null;
        document.body.classList.remove("editing");
        bar.hidden = true;
        bar.classList.remove("dock-bottom");
    }

    const selectedCtl = () => editing && editing.layout.controls.find(c => c.id === editing.selected);

    function selectControl(id) {
        if (!editing) return;
        editing.selected = id;
        for (const [cid, el] of ctlEls) el.classList.toggle("ctl-selected", cid === id);
        const c = selectedCtl();
        $("#edSel").textContent = c ? controlTitle(c) : "Tap a control";
        for (const k of ["edSize", "edMinus", "edPlus", "edDup", "edDel"]) $("#" + k).disabled = !c;
        edSize.value = c ? Math.round(c.s * 100) : 100;
        $("#edSizeVal").textContent = (c ? Math.round(c.s * 100) : 100) + "%";
        renderProps();
        if (c) bar.classList.toggle("dock-bottom", c.y < 50);
    }

    function controlTitle(c) {
        if (c.type === "button") return mapDisplayName(c.map);
        if (c.type === "stick") return c.map === "L" ? "Left stick" : "Right stick";
        if (c.type === "dpad") return "D-pad";
        if (c.type === "face") return "Button group";
        return "Touchpad";
    }

    function mutated(c, rebuild) {
        if (rebuild) refreshControl(c); else { const el = ctlEls.get(c.id); if (el) placeControl(el, c); }
    }

    function renderProps() {
        const box = $("#edProps");
        box.textContent = "";
        const c = selectedCtl();
        if (!c) return;
        const add = n => box.appendChild(n);
        const lbl = t => { const s = document.createElement("span"); s.textContent = t; return s; };
        const chk = (text, val, fn) => {
            const l = mkEl("chk", "label");
            const i = document.createElement("input"); i.type = "checkbox"; i.checked = !!val;
            i.addEventListener("change", () => fn(i.checked));
            l.append(i, document.createTextNode(text));
            return l;
        };
        const select = (items, cur, fn) => {
            const s = document.createElement("select");
            for (const [v, t] of items) { const o = document.createElement("option"); o.value = v; o.textContent = t; s.appendChild(o); }
            s.value = cur; s.addEventListener("change", () => fn(s.value));
            return s;
        };
        const colorPicker = () => {
            const i = document.createElement("input"); i.type = "color"; i.value = c.color || "#6e6e6e";
            i.addEventListener("change", () => { pushUndo(); c.color = i.value; delete c.colors; mutated(c, true); });
            const x = document.createElement("button"); x.textContent = "Reset colour";
            x.addEventListener("click", () => { pushUndo(); delete c.color; delete c.colors; mutated(c, true); });
            return [lbl("Colour"), i, x];
        };
        const textBox = (ph, val, fn, short) => {
            const i = document.createElement("input"); i.type = "text"; i.maxLength = 8; i.placeholder = ph; i.value = val || "";
            if (short) i.className = "short";
            i.addEventListener("change", () => { pushUndo(); fn(i.value.trim()); });
            return i;
        };

        if (c.type === "button") {
            add(lbl("Does"));
            add(mapSelect(c.map, v => { pushUndo(); c.map = v; if (!c.label) delete c.label; mutated(c, true); selectControl(c.id); }));
            add(textBox("Label", c.label, v => { if (v) c.label = v; else delete c.label; mutated(c, true); }));
            add(select(SHAPES, c.shape || "round", v => { pushUndo(); c.shape = v; mutated(c, true); }));
            for (const n of colorPicker()) add(n);
            add(chk("Turbo", c.turbo, v => { pushUndo(); c.turbo = v; mutated(c, true); }));
            add(chk("Toggle", c.latch, v => { pushUndo(); c.latch = v; mutated(c, true); }));
            if (c.map === "LT" || c.map === "RT") {
                const r = document.createElement("input"); r.type = "range"; r.min = 10; r.max = 100; r.value = c.value ?? 100;
                r.addEventListener("change", () => { pushUndo(); c.value = Number(r.value); mutated(c, true); });
                add(lbl("Pull")); add(r);
            }
        } else if (c.type === "face") {
            add(lbl("Preset"));
            add(select([["", "Choose..."], ...Object.keys(FACE).map(k => [k, FACE_NAMES[k]])], "", v => {
                if (!v) return;
                pushUndo();
                const f = FACE[v];
                c.style = f.style; c.maps = f.maps.slice();
                if (f.labels) c.labels = f.labels.slice(); else delete c.labels;
                if (f.colors) c.colors = f.colors.slice(); else delete c.colors;
                delete c.color;
                mutated(c, true); selectControl(c.id);
            }));
            add(select(FACE_STYLES, c.style, v => {
                pushUndo();
                if ((v === "diamond" || v === "gc") && c.maps.length !== 4) { toast("That arrangement needs exactly 4 buttons"); selectControl(c.id); return; }
                c.style = v; mutated(c, true);
            }));
            add(select(SHAPES, c.shape || "round", v => { pushUndo(); c.shape = v; mutated(c, true); }));
            for (const n of colorPicker()) add(n);
            add(chk("Turbo", c.turbo, v => { pushUndo(); c.turbo = v; mutated(c, true); }));
            add(chk("Toggle", c.latch, v => { pushUndo(); c.latch = v; mutated(c, true); }));
            const un = document.createElement("button");
            un.textContent = "Split into buttons";
            un.addEventListener("click", () => ungroupFace(c));
            add(un);
        } else if (c.type === "stick") {
            add(lbl("Stick"));
            add(select([["L", "Left"], ["R", "Right"]], c.map, v => { pushUndo(); c.map = v; mutated(c, true); selectControl(c.id); }));
            for (const n of colorPicker()) add(n);
            const r = document.createElement("input"); r.type = "range"; r.min = 40; r.max = 250; r.value = Math.round((c.sens ?? 1) * 100);
            r.addEventListener("change", () => { pushUndo(); c.sens = Number(r.value) / 100; });
            add(lbl("Sensitivity")); add(r);
        } else if (c.type === "touchpad") {
            add(textBox("Label", c.label, v => { if (v) c.label = v; else delete c.label; mutated(c, true); }));
            const r = document.createElement("input"); r.type = "range"; r.min = 40; r.max = 300; r.value = Math.round((c.sens ?? 1) * 100);
            r.addEventListener("change", () => { pushUndo(); c.sens = Number(r.value) / 100; });
            add(lbl("Speed")); add(r);
            add(lbl("Drag = move mouse, tap = left click"));
        } else {
            add(lbl("The D-pad has no extra options. Add single D-pad buttons from the Add menu."));
        }
    }

    function ungroupFace(c) {
        pushUndo();
        const el = ctlEls.get(c.id);
        const kids = [...el.querySelectorAll(".fbtn")];
        const sr = stage.getBoundingClientRect();
        const list = editing.layout.controls;
        const idx = list.indexOf(c);
        const fresh = kids.map((k, i) => {
            const r = k.getBoundingClientRect();
            const n = {
                id: newCid(), type: "button", map: c.maps[i],
                x: round1(clamp(((r.left + r.width / 2) - sr.left) / sr.width * 100, 0, 100)),
                y: round1(clamp(((r.top + r.height / 2) - sr.top) / sr.height * 100, 0, 100)),
            };
            // size: ratio of the real rendered button to a standard (15u) button
            const probe = mkEl("ctl cbtn");
            probe.style.visibility = "hidden";
            layer.appendChild(probe);
            n.s = Math.round(clamp(r.width / probe.offsetWidth, 0.35, 3.2) * 100) / 100;
            probe.remove();
            if (c.labels && c.labels[i]) n.label = c.labels[i];
            const col = (c.colors && c.colors[i]) || c.color;
            if (col) n.color = col;
            if (c.shape) n.shape = c.shape;
            if (c.turbo) n.turbo = true;
            if (c.latch) n.latch = true;
            return n;
        });
        list.splice(idx, 1, ...fresh);
        el.remove();
        ctlEls.delete(c.id);
        for (const n of fresh) { const e = buildControl(n); layer.appendChild(e); ctlEls.set(n.id, e); }
        selectControl(fresh[0] ? fresh[0].id : null);
    }

    function setSelectedScale(pct) {
        const c = selectedCtl();
        if (!c) return;
        c.s = Math.round(clamp(pct, 35, 320)) / 100;
        mutated(c, false);
        edSize.value = Math.round(c.s * 100);
        $("#edSizeVal").textContent = Math.round(c.s * 100) + "%";
    }
    edSize.addEventListener("pointerdown", pushUndo);
    edSize.addEventListener("input", () => setSelectedScale(Number(edSize.value)));
    $("#edMinus").addEventListener("click", () => { pushUndo(); setSelectedScale(Number(edSize.value) - 5); });
    $("#edPlus").addEventListener("click", () => { pushUndo(); setSelectedScale(Number(edSize.value) + 5); });

    $("#edDel").addEventListener("click", () => {
        const c = selectedCtl();
        if (!c) return;
        pushUndo();
        editing.layout.controls = editing.layout.controls.filter(x => x.id !== c.id);
        ctlEls.get(c.id)?.remove();
        ctlEls.delete(c.id);
        selectControl(null);
    });
    $("#edDup").addEventListener("click", () => {
        const c = selectedCtl();
        if (!c) return;
        pushUndo();
        const copy = cloneLayout(c);
        copy.id = newCid();
        copy.x = round1(clamp(c.x + 5, 0, 100));
        copy.y = round1(clamp(c.y + 6, 0, 100));
        editing.layout.controls.push(copy);
        const el = buildControl(copy);
        layer.appendChild(el);
        ctlEls.set(copy.id, el);
        selectControl(copy.id);
    });

    edAdd.addEventListener("change", () => {
        const v = edAdd.value;
        edAdd.value = "";
        if (!v || !editing) return;
        pushUndo();
        const kind = v.startsWith("b:") ? v.slice(2) : v;
        const c = makeControl(kind, 50, 50, 1);
        // nudge so stacked additions stay individually grabbable
        const n = editing.layout.controls.filter(x => Math.abs(x.x - 50) < 8 && Math.abs(x.y - 50) < 8).length;
        c.x = round1(50 + n * 3); c.y = round1(50 + n * 4);
        editing.layout.controls.push(c);
        const el = buildControl(c);
        layer.appendChild(el);
        ctlEls.set(c.id, el);
        selectControl(c.id);
    });

    $("#edUndo").addEventListener("click", () => {
        if (!editing || !undoStack.length) return;
        const prev = undoStack.pop();
        const keepSel = editing.selected;
        editing.layout = prev;
        active = prev;
        edName.value = prev.name;
        edTheme.value = prev.theme;
        edOpacity.value = Math.round(prev.opacity * 100);
        applyTheme(prev);
        renderLayout(prev);
        selectControl(prev.controls.some(c => c.id === keepSel) ? keepSel : null);
        $("#edUndo").disabled = undoStack.length === 0;
    });

    $("#edSnap").addEventListener("click", e => { editing.snap = !editing.snap; e.currentTarget.classList.toggle("on", editing.snap); });
    $("#edCollapse").addEventListener("click", () => bar.classList.toggle("collapsed"));
    edTheme.addEventListener("change", () => { pushUndo(); editing.layout.theme = edTheme.value; applyTheme(editing.layout); });
    edOpacity.addEventListener("pointerdown", pushUndo);
    edOpacity.addEventListener("input", () => {
        editing.layout.opacity = clamp(Number(edOpacity.value) / 100, 0.25, 1);
        stage.style.setProperty("--ui-opacity", String(editing.layout.opacity));
    });
    edName.addEventListener("input", () => { editing.layout.name = edName.value.slice(0, 40); });

    $("#edCancel").addEventListener("click", () => {
        const back = editing.returnTo;
        stopEditing();
        showLayout(back || PRESETS[0], false);
    });

    $("#edSave").addEventListener("click", () => {
        const l = sanitizeLayout(editing.layout);
        l.id = editing.layout.id;
        l.name = (edName.value.trim() || "My layout").slice(0, 40);
        const i = customLayouts.findIndex(x => x.id === l.id);
        if (i >= 0) customLayouts[i] = l; else customLayouts.push(l);
        saveCustomLayouts();
        stopEditing();
        showLayout(l);
        toast('Saved "' + l.name + '"');
    });

    // Dragging controls. They ignore pointer events while editing, so hit
    // testing is done by hand against their on-screen rectangles.
    function hitTest(x, y) {
        let best = null, bestArea = Infinity;
        for (const c of editing.layout.controls) {
            const el = ctlEls.get(c.id);
            if (!el) continue;
            const r = el.getBoundingClientRect();
            if (x >= r.left - 6 && x <= r.right + 6 && y >= r.top - 6 && y <= r.bottom + 6) {
                const area = r.width * r.height;
                if (area < bestArea) { best = c; bestArea = area; }
            }
        }
        return best;
    }

    stage.addEventListener("pointerdown", e => {
        if (!editing) return;
        e.preventDefault();
        const c = hitTest(e.clientX, e.clientY);
        if (!c) { selectControl(null); return; }
        if (editing.selected !== c.id) selectControl(c.id);
        pushUndo();
        const sr = stage.getBoundingClientRect();
        editing.drag = {
            pointerId: e.pointerId, moved: false,
            ox: e.clientX - (sr.left + c.x / 100 * sr.width),
            oy: e.clientY - (sr.top + c.y / 100 * sr.height),
        };
        try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    });
    stage.addEventListener("pointermove", e => {
        if (!editing || !editing.drag || editing.drag.pointerId !== e.pointerId) return;
        e.preventDefault();
        const c = selectedCtl();
        if (!c) return;
        const sr = stage.getBoundingClientRect();
        let x = (e.clientX - editing.drag.ox - sr.left) / sr.width * 100;
        let y = (e.clientY - editing.drag.oy - sr.top) / sr.height * 100;
        if (editing.snap) { x = Math.round(x / 2.5) * 2.5; y = Math.round(y / 2.5) * 2.5; }
        c.x = round1(clamp(x, 0, 100));
        c.y = round1(clamp(y, 0, 100));
        editing.drag.moved = true;
        mutated(c, false);
    });
    const endDrag = e => {
        if (!editing || !editing.drag || editing.drag.pointerId !== e.pointerId) return;
        if (!editing.drag.moved && undoStack.length) undoStack.pop();    // a plain tap changed nothing
        $("#edUndo").disabled = undoStack.length === 0;
        const c = selectedCtl();
        if (c) bar.classList.toggle("dock-bottom", c.y < 50);
        editing.drag = null;
    };
    stage.addEventListener("pointerup", endDrag);
    stage.addEventListener("pointercancel", endDrag);

    // ------------------------------------------------------------- dev helpers
    // window.__layoutAudit(): reports overlapping / off-screen controls for every
    // preset at the current window size.
    window.__layoutAudit = async () => {
        const out = [];
        const saved = active;
        for (const p of PRESETS) {
            showLayout(p, false);
            await new Promise(r => setTimeout(r, 30));
            const items = [];
            for (const c of p.controls) {
                const el = ctlEls.get(c.id);
                if (!el) continue;
                if (c.type === "face" && (c.style === "row" || c.style === "grid")) {
                    // children are tighter than the box; use the box
                }
                items.push([c, el.getBoundingClientRect()]);
            }
            const menu = $("#themeSwitcher").getBoundingClientRect();
            const issues = [];
            const nm = c => (c.map ? c.type + ":" + c.map : c.type) + (c.type === "face" ? "(" + c.maps.join("") + ")" : "");
            for (let i = 0; i < items.length; i++) {
                const [a, A] = items[i];
                if (A.left < -1 || A.top < -1 || A.right > innerWidth + 1 || A.bottom > innerHeight + 1) issues.push("OOB " + nm(a));
                if (rectsOverlap(A, menu, -2)) issues.push("MENU overlaps " + nm(a));
                for (let j = i + 1; j < items.length; j++) {
                    const [b, B] = items[j];
                    if (rectsOverlap(A, B, -3)) issues.push(nm(a) + " x " + nm(b));
                }
            }
            if (issues.length) out.push(p.name + ": " + issues.join("; "));
        }
        showLayout(saved, false);
        return out;
    };
    window.__presets = PRESETS;

    window.controllerDiagnostics = () => ({
        playerId: state.playerId, connected: state.connected,
        gyro: { enabled: state.gyroEnabled, ready: state.gyroReady, source: state.gyroSensorSource },
        packetSeq: state.packetSeq, lastInputMs: Math.round(performance.now() - state.lastInputAt),
        reconnectDelayMs: Math.round(state.reconnectDelay),
    });

    // -------------------------------------------------------------------- init
    restoreLayout();
    updatePillLabel();
    handleOrientationChange();
    connect();
})();
</script>
</body>
</html>
